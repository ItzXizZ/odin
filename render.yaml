services:
  - type: web
    name: odin
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Keep the app free after sign-up; set true to require Stripe subscription.
      - key: STRIPE_PAYWALL_ENABLED
        value: "false"
